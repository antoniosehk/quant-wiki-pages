site_name: 可视化量化金融
site_url: https://antoniosehk.github.io/quant-wiki-pages/zh/
docs_dir: docs/zh
theme:
  name: material
  language: zh
  custom_dir: overrides
  features:
    - navigation.footer
    - navigation.indexes
    - search.highlight
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: 深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 浅色模式
plugins:
  - search:
      lang: zh
markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
extra:
  locale: zh-CN
  alternate:
    - name: English
      link: /quant-wiki-pages/en/
      lang: en
    - name: 简体中文
      link: /quant-wiki-pages/zh/
      lang: zh
